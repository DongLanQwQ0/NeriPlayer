name: Vivo upstream builds

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivo-upstream
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'DongLanQwQ0/NeriPlayer'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      has_builds: ${{ steps.pending.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Discover new upstream commits and releases
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_vivo_upstream.py'
          python3 .github/scripts/vivo_upstream.py discover

  build:
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay vivo changes on the upstream revision
        env:
          UPSTREAM_SHA: ${{ matrix.sha }}
        run: python3 .github/scripts/vivo_upstream.py prepare "$UPSTREAM_SHA"
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Install pinned Android NDK
        uses: ./.github/actions/android-ndk
      - name: Test presentation and build the isolated debug package
        run: |
          chmod +x gradlew
          ./gradlew :playback:runtime:testDebugUnitTest --tests '*PlaybackServicePresentationOwnerTest' --tests '*PlaybackNotificationSeekTest' --tests '*VivoMusic*Test' --tests '*CarMediaSessionCallbackTest' --console=plain
          ./gradlew :app:assembleDebug --console=plain
      - name: Package APK and corresponding source
        run: |
          mkdir -p vivo-dist
          cp app/build/outputs/apk/debug/*.apk vivo-dist/NeriPlayer-vivo.apk
          python3 .github/scripts/vivo_upstream.py archive vivo-dist/NeriPlayer-vivo-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: vivo-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.outputs.has_builds == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # A fresh runner never executes the fetched upstream build with signing secrets present.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: vivo-dist
      - name: Set up signing runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sign with the persistent local test identity
        env:
          KEYSTORE_B64: ${{ secrets.VIVO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VIVO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIVO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          key="$RUNNER_TEMP/vivo-test.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD vivo-dist/NeriPlayer-vivo.apk
          "$signer" verify vivo-dist/NeriPlayer-vivo.apk
      - name: Publish the completed build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ matrix.tag }}
          BUILD_KIND: ${{ matrix.kind }}
          UPSTREAM_LABEL: ${{ matrix.label }}
          UPSTREAM_SHA: ${{ matrix.sha }}
          FORK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '非官方 vivo 适配构建\n\n上游：cwuom/NeriPlayer@%s\n上游版本：%s\n适配源码：DongLanQwQ0/NeriPlayer@%s\n\n包名 moe.ouom.neriplayer.debug，使用固定测试签名。对应源码包含子模块，见附件。\n原子岛仍需目标设备场景权限，本构建不自动开通厂商准入。\n' \
            "$UPSTREAM_SHA" "$UPSTREAM_LABEL" "$FORK_SHA" > "$RUNNER_TEMP/release-notes.txt"
          args=(--repo "$GH_REPO" --target "$FORK_SHA" --title "Vivo · $UPSTREAM_LABEL" --notes-file "$RUNNER_TEMP/release-notes.txt" --latest=false)
          if [ "$BUILD_KIND" = commit ]; then args+=(--prerelease); fi
          if ! gh release view "$BUILD_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$BUILD_TAG" --draft "${args[@]}"
          fi
          gh release upload "$BUILD_TAG" vivo-dist/NeriPlayer-vivo.apk vivo-dist/NeriPlayer-vivo-source.zip --repo "$GH_REPO" --clobber
          gh release edit "$BUILD_TAG" --repo "$GH_REPO" --draft=false
