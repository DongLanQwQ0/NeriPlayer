name: Vivo upstream releases

on:
  schedule:
    # Poll published Releases only; ordinary upstream commits never enter merge/build.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivo-upstream
  cancel-in-progress: false

jobs:
  discover:
    name: Detect upstream Release (no APK build)
    if: github.repository == 'DongLanQwQ0/NeriPlayer'
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.pending.outputs.has_release }}
      sha: ${{ steps.pending.outputs.sha }}
      tag: ${{ steps.pending.outputs.tag }}
      label: ${{ steps.pending.outputs.label }}
      prerelease: ${{ steps.pending.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Discover the next unpublished upstream Release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_vivo_upstream.py'
          python3 .github/scripts/vivo_upstream.py discover

  merge:
    needs: discover
    if: needs.discover.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.merged_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge the pinned upstream Release into the fork
        id: merge
        env:
          UPSTREAM_SHA: ${{ needs.discover.outputs.sha }}
        run: |
          python3 .github/scripts/vivo_upstream.py merge "$UPSTREAM_SHA"
          # Imported upstream workflows must not re-enable push/PR builds in this fork.
          python3 -B -m unittest discover -s .github/scripts -p 'test_vivo_upstream.py'
          git push origin HEAD:refs/heads/master

  build:
    needs: [discover, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Install pinned Android NDK
        uses: ./.github/actions/android-ndk
      - name: Test playback presentation and startup
        run: |
          chmod +x gradlew
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' :playback:runtime:testDebugUnitTest --tests '*PlaybackServicePresentationOwnerTest' --tests '*PlaybackServiceMetadataPublicationTest' --tests '*PlaybackNotificationSeekTest' --tests '*VivoMusic*Test' --tests '*CarMediaSessionCallbackTest' --console=plain
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' :app:testDebugUnitTest --tests '*AppContainer*Test' --tests '*NeriAppStartupGlassGatePolicyTest' --console=plain
      - name: Build the optimized, non-debuggable vivo release
        env:
          UPSTREAM_LABEL: ${{ needs.discover.outputs.label }}
          MERGED_SHA: ${{ needs.merge.outputs.sha }}
        run: |
          version_code="$(( $(date -u +%s) - 1577836800 ))"
          ./gradlew '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' :app:assembleVivoRelease -PallowUnsignedRelease=true \
            "-PvivoVersionCode=$version_code" "-PvivoVersionName=$UPSTREAM_LABEL-vivo.${MERGED_SHA:0:8}" --console=plain
          mkdir -p vivo-dist
          cp app/build/outputs/apk/vivoRelease/*.apk vivo-dist/NeriPlayer-vivo.apk
          python3 .github/scripts/vivo_upstream.py archive vivo-dist/NeriPlayer-vivo-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.discover.outputs.tag }}
          path: vivo-dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Preserve R8 mappings and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-release-verification
          path: |
            app/build/outputs/mapping/vivoRelease/mapping.txt
            app/build/test-results/testDebugUnitTest/
            modules/playback/runtime/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  publish:
    needs: [discover, merge, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: signing secrets never reach a runner executing upstream code.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.discover.outputs.tag }}
          path: vivo-dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sign and verify the independent release identity
        env:
          KEYSTORE_B64: ${{ secrets.VIVO_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VIVO_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIVO_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIVO_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: '70ba48ad41fc46f30270a7fe86cd057915cc6a15b6a2bc509a1922a632618a67'
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          key="$RUNNER_TEMP/vivo-release.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          keytool -list -storetype PKCS12 -keystore "$key" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          aapt="$(dirname "$signer")/aapt"
          badging="$("$aapt" dump badging vivo-dist/NeriPlayer-vivo.apk)"
          printf '%s\n' "$badging" | grep -q "package: name='moe.ouom.neriplayer.vivo'"
          if printf '%s\n' "$badging" | grep -q 'application-debuggable'; then
            echo 'Refusing to publish a debuggable APK' >&2
            exit 1
          fi
          "$signer" sign --ks "$key" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD vivo-dist/NeriPlayer-vivo.apk
          "$signer" verify --print-certs vivo-dist/NeriPlayer-vivo.apk | tee "$RUNNER_TEMP/certificate.txt"
          # SDK versions label signers differently; every reported identity must match the pin.
          actual_cert="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | sort -u)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
      - name: Publish the release and trigger configured GitHub notifications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ needs.discover.outputs.tag }}
          UPSTREAM_LABEL: ${{ needs.discover.outputs.label }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.sha }}
          FORK_SHA: ${{ needs.merge.outputs.sha }}
          PRERELEASE: ${{ needs.discover.outputs.prerelease }}
        run: |
          set -euo pipefail
          printf '非官方 vivo 适配 Release\n\n上游版本：%s\n上游提交：cwuom/NeriPlayer@%s\n合并源码：DongLanQwQ0/NeriPlayer@%s\n\n包名 moe.ouom.neriplayer.vivo，独立固定 release 签名，开启 R8 优化，与原版及 debug 版并存。首次安装需导入数据并配置目标设备场景权限。\n附件源码 ZIP 包含子模块，准确对应本 APK。\n' \
            "$UPSTREAM_LABEL" "$UPSTREAM_SHA" "$FORK_SHA" > "$RUNNER_TEMP/release-notes.txt"
          if ! gh release view "$BUILD_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            args=(--repo "$GH_REPO" --target "$FORK_SHA" --title "Vivo · $UPSTREAM_LABEL" --notes-file "$RUNNER_TEMP/release-notes.txt" --latest=false --draft)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$BUILD_TAG" "${args[@]}"
          fi
          gh release upload "$BUILD_TAG" vivo-dist/NeriPlayer-vivo.apk vivo-dist/NeriPlayer-vivo-source.zip --repo "$GH_REPO" --clobber
          gh release edit "$BUILD_TAG" --repo "$GH_REPO" --draft=false
          gh release view "$BUILD_TAG" --repo "$GH_REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
